.ship .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ship .eta{font-family:var(--f-display);font-size:28px;font-weight:700;line-height:1}

.s-ok{color:var(--ok);background:var(--ok-bg)} .s-warn{color:var(--warn);background:var(--warn-bg)}

.cat[aria-pressed="true"] small{color:inherit;opacity:.8}

const CJK=/[㐀-鿿豈-﫿　-〿＀-￯]/;
function splitName(raw){
  raw=String(raw||"").replace(/\s+/g," ").trim();
  let zh="",en="";
  for(const ch of raw){ if(CJK.test(ch)) zh+=ch; else en+=ch; }
  zh=zh.replace(/[（）()]/g,"").trim(); en=en.replace(/^[\s\-–,，/]+|[\s\-–,，/]+$/g,"").replace(/\s+/g," ");
  // "ZINC OXIDE Zinc oxide" -> "Zinc oxide"
  const w=en.split(" "); if(w.length%2===0){const h=w.length/2;if(w.slice(0,h).join(" ").toLowerCase()===w.slice(h).join(" ").toLowerCase())en=w.slice(h).join(" ");}
  return {zh,en};
}
function bi(raw){const s=splitName(raw);return lang==="zh"?(s.zh||s.en):(s.en||s.zh);}
function catOf(raw){
  const n=norm(raw);
  if(!n) return {k:"none",zh:"其他",en:"Others",ar:""};
  for(const c of CATS) if(c.kw.some(k=>n.includes(norm(k)))) return c;
  const s=splitName(raw); return {k:"x:"+n,zh:s.zh||s.en,en:s.en||s.zh,ar:s.en||s.zh};
}
function norm(s){
  return String(s??"").normalize("NFKC").toLowerCase()
   .replace(/[ً-ٰٟـ]/g,"").replace(/[أإآٱ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي")
   .replace(/[\s\-_.,，。、/\\()（）:：;；'"“”‘’\[\]【】=+*#]/g,"");
}
function lev(a,b,max){
  if(Math.abs(a.length-b.length)>max) return max+1;
  let prev=Array.from({length:b.length+1},(_,i)=>i);
  for(let i=1;i<=a.length;i++){const cur=[i];let best=i;
    for(let j=1;j<=b.length;j++){cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));best=Math.min(best,cur[j]);}
    if(best>max) return max+1; prev=cur;}
  return prev[b.length];
}
function subseq(tok,hay){let i=0,first=-1,last=-1;for(let j=0;j<hay.length&&i<tok.length;j++){if(hay[j]===tok[i]){if(first<0)first=j;last=j;i++;}}return i===tok.length&&(last-first)<=tok.length*3;}

/* ---------- search index ---------- */
let INDEX=[];
function shipById(id){return DATA.shipments.find(s=>s.id===id)||{};}
function buildIndex(){
  INDEX=DATA.items.map(it=>{
    const sh=shipById(it.ship), c=catOf(it.cat);
    const f=[[it.name,3],[it.ar,3],[it.pkg,3],[c.zh+" "+c.en+" "+c.ar+" "+it.cat,2],[it.use,2],[it.ship,2],[sh.seal,1],[(sh.invoices||[]).join(" "),1],[it.detail,1],[it.size,1],[it.material,1],[it.pkgType,1]];
    const fields=f.filter(x=>x[0]).map(([v,w])=>{const raw=String(v);return {n:norm(raw),w,words:raw.normalize("NFKC").toLowerCase().split(/[^a-z0-9؀-ۿ]+/).map(norm).filter(x=>x.length>=3)};});
    return {it,fields,cat:c};
  });
}
function scoreTok(tok,fields){
  let best=0;
  for(const f of fields){
    let s=0; const p=f.n.indexOf(tok);
    if(p>=0) s=(p===0?12:10)*f.w + (tok.length===f.n.length?6:0);
    else if(tok.length>=2&&subseq(tok,f.n)) s=4*f.w;
    else if(/^[a-z0-9؀-ۿ]{4,}$/.test(tok)){
      const max=tok.length>=7?2:1;
      for(const w of f.words){ const cut=w.slice(0,tok.length+max); if(lev(tok,w,max)<=max||lev(tok,cut,max)<=max){s=6*f.w;break;} }
    }
    if(s>best) best=s;
  }
  return best;
}
function search(q){
  const toks=String(q).split(/\s+/).map(norm).filter(Boolean);
  const pool=INDEX.filter(x=>(!S.cat||x.cat.k===S.cat)&&(!S.use||useKey(x.it)===S.use)&&inSel(x.it.ship));
  if(!toks.length) return {rows:pool.map(x=>x.it),fuzzy:false};
  const and=[],or=[];
  for(const x of pool){
    const sc=toks.map(tk=>scoreTok(tk,x.fields)); const sum=sc.reduce((a,b)=>a+b,0);
    if(sc.every(v=>v>0)) and.push([sum,x.it]); else if(sum>0) or.push([sum,x.it]);
  }
  const by=(a,b)=>b[0]-a[0];
  if(and.length) return {rows:and.sort(by).map(x=>x[1]),fuzzy:false};
  return {rows:or.sort(by).slice(0,30).map(x=>x[1]),fuzzy:or.length>0};
}
function hl(text,q){
  text=String(text||""); const toks=String(q).split(/\s+/).filter(x=>x.length>=1);
  let out=esc(text);
  for(const tk of toks){ const re=new RegExp("("+tk.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig"); out=out.replace(re,"<mark>$1</mark>"); }
  return out;
}

/* ---------- dates & status ---------- */
const DAY=86400000;
function todayISO(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function diffDays(iso){if(!iso)return null;const a=Date.parse(iso+"T00:00:00"),b=Date.parse(todayISO()+"T00:00:00");return Math.round((a-b)/DAY);}
function fmtD(iso){if(!iso)return "";const [y,m,d]=iso.split("-");return lang==="en"?new Date(+y,m-1,+d).toLocaleDateString("en-GB",{day:"numeric",month:"short"}):lang==="ar"?d+"/"+m:(+m)+"月"+(+d)+"日";}
function shipState(sh){
  if(sh.status) return sh.status;
  if(!sh.eta) return "pending";
  return diffDays(sh.eta)>0?"sailed":"late";
}
function pill(sh){const k=shipState(sh);return `<span class="pill s-${STATUS_TONE[k]}">${esc(T.zh.st[k])}</span>`;}
function countdown(sh){
  const k=shipState(sh); if(["arrived","clearing","released","delivered"].includes(k)||!sh.eta) return "";
  const d=diffDays(sh.eta); if(d>0) return `<span class="countdown num">${esc(t("daysLeft",{n:d}))}</span>`;
  if(d===0) return `<span class="countdown">${esc(t("today0"))}</span>`;
  return `<span class="c num">${esc(t("overdue",{n:-d}))}</span>`;
}
const img=p=>p?(blobUrls[p]||p):"";

function invLabel(sh){return (sh&&sh.invoices&&sh.invoices.length)?sh.invoices.join(" / "):"未读到发票号";}
function groups(ids){
  const m=new Map(); const list=ids?ids.map(shipById).filter(x=>x.id):DATA.shipments;
  for(const sh of list){const k=invLabel(sh); if(!m.has(k)) m.set(k,{key:k,ships:[]}); m.get(k).ships.push(sh);}
  return [...m.values()];
}
function gv(g,f){const v=g.ships.map(x=>x[f]).filter(Boolean).sort();return v[0]||"";}
function gproxy(g){return {eta:gv(g,"eta"),status:gv(g,"status"),etaFactory:gv(g,"etaFactory"),etd:gv(g,"etd"),loaded:gv(g,"loaded")};}
function inSel(shipId){return !S.ship||invLabel(shipById(shipId))===S.ship;}
function renderShips(){
  const gs=groups().sort((a,b)=>(gv(a,"eta")||"9999").localeCompare(gv(b,"eta")||"9999"));
  $("#ships").innerHTML=gs.length?gs.map(g=>{

function renderCats(){

  const m=new Map(); for(const x of pool){const c=x.cat;if(!m.has(c.k))m.set(c.k,{c,n:0});m.get(c.k).n++;}

  $("#cats").innerHTML=h;

  const uses=new Map();

  const arr=[...uses].sort((a,b)=>(a[0]==="__none")-(b[0]==="__none")||b[1].n-a[1].n);
  $("#uses").innerHTML=arr.length?`<span class="chips-label">${esc(t("use"))}：</span><button type="button" class="chip" data-use="" aria-pressed="${!S.use}">${esc(t("all"))}</button>`+arr.map(([k,v])=>`<button type="button" class="chip" data-use="${esc(k)}" aria-pressed="${S.use===k}">${esc(useLabel(v.raw))} · ${v.n}</button>`).join(""):"";
}
function renderList(){
  const {rows,fuzzy}=search(S.q);
  $("#count").textContent=rows.length+" "+t("items");
  const act=[];
  if(S.ship) act.push(`<button type="button" class="chip" data-clear="ship">发票: <span class="mono">${esc(S.ship)}</span> ×</button>`);

    const sh0=shipById(it.ship), sh=Object.assign({},sh0,gproxy(groups().find(g=>g.key===invLabel(sh0))||{ships:[sh0]})), nm=splitName(it.name);
    const main=nm.zh||nm.en;

      <span class="it-main"><span class="it-name">${hl(main,S.q)}</span>
        <span class="it-sub">${hl(sub,S.q)}</span>
        <span class="it-tags"><span class="mono">${hl(it.pkg,S.q)}</span><span class="num">${esc(fmtNum(it.qty))} ${esc(it.unit)}</span><span>${esc(catOf(it.cat).zh)}${it.use?" · "+esc(useLabel(it.use)):""}</span><span class="mono">${hl(invLabel(sh),S.q)}</span></span></span>
      <span class="it-eta"><span>${pill(sh)}</span><span class="d num">${sh.eta?esc(fmtD(sh.eta)):esc(t("tbd"))}</span>${countdown(sh)||`<span class="c">${esc(t("eta"))}</span>`}</span>
    </button>`;}).join("");
}
function fmtNum(n){return typeof n==="number"?n.toLocaleString("en-US",{maximumFractionDigits:3}):String(n??"");}
function useKey(it){return it.use?norm(it.use):"__none";}
function useLabel(raw){return raw?bi(raw):"其他";}
function useSummary(k,pool){const set=new Set();for(const x of pool)if(x.cat.k===k&&x.it.use)set.add(useLabel(x.it.use));const a=[...set];return a.length?a.slice(0,3).join("、")+(a.length>3?"…":""):"";}

}

function withTimeout(pr,ms,what){return Promise.race([pr,new Promise((_,no)=>setTimeout(()=>no(new Error(what+"超时，请检查网络后再点一次")),ms))]);}
async function dbSave(){
  if(saving) return; saving=true;
  const msgEl={set textContent(t){setSaveMsg(t);}}; setSaveBtns(true); msgEl.textContent="正在连接数据库…";
  try{
    const c=await sb(); const paths=Object.keys(pendingFiles); const map={}; let n=0;
    for(const p of paths){
      msgEl.textContent=`正在上传照片 ${++n}/${paths.length}…`;
      const name=p.replace(/^photos\//,"").replace(/\.jpg$/,"")+"-"+Date.now().toString(36)+".jpg";
      const {error}=await withTimeout(c.storage.from("photos").upload(name,pendingFiles[p],{contentType:"image/jpeg",upsert:false}),45000,"照片上传");
      if(error) throw Object.assign(new Error(error.message),{kind:"photo"});
      map[p]=c.storage.from("photos").getPublicUrl(name).data.publicUrl;
    }
    for(const it of DATA.items){ if(map[it.photo]) it.photo=map[it.photo]; it.loadPhotos=(it.loadPhotos||[]).map(x=>map[x]||x); }
    for(const p in map){ blobUrls[map[p]]=blobUrls[p]; delete pendingFiles[p]; }
    msgEl.textContent="正在保存数据…";
    DATA.updated=new Date().toISOString().slice(0,10);
    const {error}=await withTimeout(c.rpc("save_data",{pw:ADMIN_PW,payload:DATA}),45000,"保存数据");
    if(error) throw Object.assign(new Error(error.message),{code:error.code});
    saving=false; dirty=false; SRC="数据库"; renderFoot(); toast("已保存并上传，大家刷新页面就能看到。");
    closeLayer(); showSaved();
  }catch(e){
    msgEl.textContent=(e.code==="28P01"||/密码错误/.test(e.message))?"保存失败：密码不对，请关闭管理后重新进入。"
      :e.kind==="photo"?"照片上传失败："+e.message:"保存失败："+(e.message||e)+"，请稍后再点一次。";
    saving=false; setSaveBtns(false);
  }
}

      <div class="wide"><button type="button" class="btn warn" data-del="${esc(g.key)}">删除这一票</button></div></div></details></div>`;}).join("");

    DATA.shipments=DATA.shipments.filter(x=>!ids.has(x.id));DATA.items=DATA.items.filter(i=>!ids.has(i.ship));if(S.ship===key)S.ship="";markDirty();renderShipForms();renderImportResult();};
}
function onGrpInput(e){
  const f=e.target.dataset.f; if(!f) return; const key=e.target.closest("[data-grp]").dataset.grp;

function ticketName(sh){return (sh.invoices&&sh.invoices.length)?"发票 "+sh.invoices.join(" / "):"未读到发票号";}
let lastImported=[];

  const box=$("#impResult"); if(!box) return;

      <label for="ir-${i}">${esc(t("eta"))}（选填）<input id="ir-${i}" type="date" data-f="eta" value="${esc(gv(g,"eta"))}"></label></div>`;}).join("")}

function showSaved(){
  const ids=lastImported.length?lastImported:[]; lastImported=[];
  const ks=groups(ids).map(g=>g.key); S.ship=ks.length===1?ks[0]:""; S.cat="";S.use="";S.q="";const q=$("#q");if(q)q.value="";

function markDirty(){dirty=true;buildIndex();renderShips();renderCats();renderList();updateSaveMsg();}
function setSaveMsg(t){document.querySelectorAll(".savemsg").forEach(m=>m.textContent=t);}
function setSaveBtns(dis){document.querySelectorAll("[data-save]").forEach(b=>b.disabled=dis);}
let saving=false;
function updateSaveMsg(){if(!$("#saveMsg"))return;if(saving)return;setSaveMsg(readOnly?ta("ro"):dirty?ta("unsaved"):"");setSaveBtns(readOnly);}
function toast(msg){const d=document.createElement("div");d.className="toast";d.setAttribute("role","status");d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),3200);}

async function save(){
  if(GH_MODE) return dbSave();
  const art=await window.claude?.use?.("artifact").catch(()=>null);
  if(!art){readOnly=true;updateSaveMsg();return;}
  setSaveBtns(true);
  DATA.updated=new Date().toISOString().slice(0,10);
  const files={"data.json":{content:JSON.stringify(DATA,null,1),contentType:"application/json"}};
  for(const p in pendingFiles) files[p]={content:pendingFiles[p],contentType:"image/jpeg"};
  try{await art.publish(files);for(const p in pendingFiles)delete pendingFiles[p];dirty=false;toast(ta("saved"));closeLayer();showSaved();}
  catch(e){
    const code=e&&e.code;
    if(code==="not_writer"||code==="not_granted"||code==="not_declared"||code==="consent_required"){readOnly=true;updateSaveMsg();}
    else if(code==="conflict"){/* view reloads to the newer version */}
    else{setSaveMsg("保存失败："+(e&&e.message||code||""));setSaveBtns(false);}
  }
}

/* ---------- Excel import ---------- */
function loadScript(src){return new Promise((ok,no)=>{if(document.querySelector(`script[src="${src}"]`))return ok();const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s);});}
async function libs(){
  await loadScript("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js");
  await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js");
}
function fnv(s){let h=0x811c9dc5;for(const b of new TextEncoder().encode(s)){h^=b;h=Math.imul(h,0x01000193)>>>0;}return h.toString(16).padStart(8,"0");}
const COLS=[["pkgs",/包装数量|packagequantity|总件数/],["pkgType",/包装方式|packingtype/],["pkg",/包装编号|packingno/],["container",/柜号|container/],["detail",/配件明细|accessor/],["cat",/货物分类|category/],["use",/用途|instructions/],["size",/型号|规格|size/],["material",/材质|material/],["name",/货物名称|description/],["qty",/^数量|qty/],["unit",/单位|unit/],["L",/^长/],["W",/^宽/],["H",/^高/],["nw",/净重|nw/],["gw",/毛重|gw/],["tw",/总重量/],["cbm",/体积|cbm/],["photo",/货物图片|备注|picture|photo/],["lp",/装柜照片|loading/]];
async function resizeJpeg(blob,maxw){
  const bmp=await createImageBitmap(blob); const k=Math.min(1,maxw/Math.max(bmp.width,bmp.height));
  const c=document.createElement("canvas");c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
  const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);g.drawImage(bmp,0,0,c.width,c.height);
  return await new Promise(r=>c.toBlob(r,"image/jpeg",.76));
}
async function importFiles(files){
  const log=$("#implog"); log.textContent="…";
  try{await libs();}catch(e){log.textContent=lang==="zh"?"无法加载 Excel 读取组件，请检查网络后重试。":"Could not load the Excel reader. Check the connection and try again.";return;}
  const lines=[], newItems=[]; lastImported=[];
  for(const f of files){
    try{
      const buf=await f.arrayBuffer();
      const wb=XLSX.read(buf,{type:"array",cellFormula:true});
      // invoice meta from any sheet
      const meta={}; const invFound=[];
      for(const sn of wb.SheetNames){const ws=wb.Sheets[sn];for(const a in ws){if(a[0]==="!")continue;const v=ws[a].v;if(typeof v!=="string")continue;
        let m; if((m=v.match(/INVOICE\s*NO\.?\s*[:：]?\s*([A-Z0-9][\w\-\/]*)/i))){invFound.push({inv:m[1].toUpperCase(),sheet:sn});}
        if(!meta.date&&/date\s*[:：]/i.test(v)&&(m=v.match(/(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/)))meta.date=`${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`;
        if(!meta.route&&(m=v.match(/FROM:\s*(.+?)\s+TO\s+(.+)$/i)))meta.route=[m[1].trim(),m[2].trim()];
        if(!meta.size&&(m=v.match(/TOTAL:\s*\d+\s*X\s*(\w+)/i)))meta.size=m[1];}}
      // 发票号：优先用文件名里的发票号；否则用 CI（商业发票）表里的
      {const fnInv=(f.name.toUpperCase().match(/\d{2}[A-Z]{2}-\d{2,4}[A-Z]?/)||[])[0];
       const uniq=[...new Set(invFound.map(x=>x.inv))];
       const ci=invFound.find(x=>/^CI$|COMMERCIAL|INVOICE|发票/i.test(x.sheet));
       meta.inv=(fnInv&&(uniq.includes(fnInv)||!uniq.length))?fnInv:(ci?ci.inv:uniq[0]);
       if(uniq.length>1||(fnInv&&uniq.length&&!uniq.includes(fnInv))) lines.push(`⚠ ${f.name}：文件里写的发票号不一致（${uniq.map(u=>invFound.filter(x=>x.inv===u).map(x=>x.sheet+"表").join("、")+"："+u).join("；")}），已按 ${meta.inv} 导入，请让国内核对单据。`);}
      // loading sheet + header
      let ws=null,hr=-1,range;
      const cand=[...wb.SheetNames].sort((a,b)=>(/loading|装柜/i.test(b)?1:0)-(/loading|装柜/i.test(a)?1:0));
      outer: for(const sn of cand){const w=wb.Sheets[sn];if(!w["!ref"])continue;const rg=XLSX.utils.decode_range(w["!ref"]);
        for(let r=rg.s.r;r<=Math.min(rg.e.r,rg.s.r+120);r++){let a=false,b=false;for(let c=rg.s.c;c<=rg.e.c;c++){const x=w[XLSX.utils.encode_cell({r,c})];const s=x?norm(x.v):"";if(/包装编号|packingno|箱号|装柜编号/.test(s))a=true;if(/货物名称|description/.test(s))b=true;}
          if(a&&b){ws=w;hr=r;range=rg;break outer;}}}
      if(!ws){lines.push(`${f.name}: ${lang==="zh"?"没找到 LOADING DETAILS 表头（需包含「包装编号」和「货物名称」）":"No LOADING DETAILS header found"}`);continue;}
      // 每个柜子可能有自己的表头行，且列顺序可能不同：遇到表头就重新对应列
      const hdrText=(r,c)=>{const x=ws[XLSX.utils.encode_cell({r,c})];return x?norm(x.v):"";};
      const isHeader=r=>{let a=false,b=false;for(let c=range.s.c;c<=range.e.c;c++){const s=hdrText(r,c);if(/包装编号|packingno|箱号|装柜编号/.test(s))a=true;if(/货物名称|description/.test(s))b=true;}return a&&b;};
      let col={}, lpCols=[];
      const mapHeader=r=>{col={};lpCols=[];
        for(let c=range.s.c;c<=range.e.c;c++){const s=hdrText(r,c);if(!s)continue;for(const [k,re] of COLS){if(col[k]===undefined&&re.test(s)){col[k]=c;break;}}}
        if(col.lp!==undefined){lpCols.push(col.lp);for(let c=col.lp+1;c<=range.e.c;c++){if(hdrText(r,c))break;lpCols.push(c);}}};
      mapHeader(hr); let headers=1;
      // merges
      const merged={};for(const m of ws["!merges"]||[]){const top=ws[XLSX.utils.encode_cell(m.s)];for(let r=m.s.r;r<=m.e.r;r++)for(let c=m.s.c;c<=m.e.c;c++)merged[r+","+c]=top;}
      const cell=(r,c)=>c===undefined?undefined:(ws[XLSX.utils.encode_cell({r,c})]||merged[r+","+c]);
      const val=(r,c)=>{const x=cell(r,c);if(!x)return "";if(x.t==="e")return x.f?String(x.f):"";const v=x.v;return typeof v==="string"?v.trim():v;};
      // WPS cell images
      const imgMap={};let zip=null;
      try{zip=await JSZip.loadAsync(buf);const ci=zip.file("xl/cellimages.xml"),rl=zip.file("xl/_rels/cellimages.xml.rels");
        if(ci&&rl){const x=await ci.async("string"),rels=await rl.async("string");const rm={};for(const m of rels.matchAll(/Id="(rId\d+)"[^>]*Target="([^"]+)"/g))rm[m[1]]=m[2];
          for(const m of x.matchAll(/name="(ID_[0-9A-Fa-f]+)"[\s\S]*?r:embed="(rId\d+)"/g)) if(rm[m[2]]) imgMap[m[1]]="xl/"+rm[m[2]].replace(/^\.?\//,"");}}catch(e){}
      const grab=async(r,c,path,maxw)=>{const x=cell(r,c);const fm=x&&(x.f||(typeof x.v==="string"?x.v:""));const m=fm&&String(fm).match(/ID_[0-9A-Fa-f]+/);if(!m||!imgMap[m[0]]||!zip)return "";const zf=zip.file(imgMap[m[0]]);if(!zf)return "";
        try{const b=await resizeJpeg(await zf.async("blob"),maxw);pendingFiles[path]=b;blobUrls[path]=URL.createObjectURL(b);return path;}catch(e){return "";}};
      let cont="",seal="",n=0,a=0,u=0,p=0,lastPkg="",subN=0; const touched=new Set(), seen=new Set();
      for(let r=hr+1;r<=range.e.r;r++){
        if(r>hr&&isHeader(r)){mapHeader(r);headers++;lastPkg="";subN=0;continue;}
        let pkg=String(val(r,col.pkg)||""),name=String(val(r,col.name)||"");
        const det=String(val(r,col.detail)||"");
        if(!pkg&&!name&&det&&lastPkg){ subN++; pkg=lastPkg+"-"+subN; name=det; }   // 同一箱里的配件明细行
        else if(pkg){ lastPkg=pkg; subN=0; }
        if(!pkg&&!name)continue;
        if(/^(合计|小计|总计|total)/i.test(pkg+name))continue;
        const cv=String(val(r,col.container)||"");const cm=cv.match(/[A-Z]{4}\s?\d{7}/);
        if(cm){cont=cm[0].replace(/\s/g,"");const sm=cv.match(/封号\s*[:：]\s*(\S+)|seal\s*no\.?\s*[:：]\s*(\S+)/i);seal=sm?(sm[1]||sm[2]):seal;}
        const ship=cont||("INV-"+(meta.inv||f.name));
        let sh=shipById(ship);
        if(!sh.id){sh={id:ship,container:ship,seal:seal||"",size:meta.size||"",invoices:[],pol:meta.route?.[0]||"",pod:meta.route?.[1]||"",loaded:meta.date||"",etd:"",eta:"",etaFactory:"",status:"",vessel:"",note:""};DATA.shipments.push(sh);}
        if(seal&&!sh.seal)sh.seal=seal;
        if(!touched.has(sh.id)){ // 第一次碰到这个柜：如果柜里原来的货全来自同一个文件，就按这次读到的发票号重来
          const olds=DATA.items.filter(i=>i.ship===sh.id); if(olds.length&&olds.every(i=>i.src===f.name)) sh.invoices=[];
          touched.add(sh.id);}
        if(meta.inv&&!sh.invoices.includes(meta.inv))sh.invoices.push(meta.inv);
        const id=ship+"|"+(pkg||name), h=fnv(id), num=x=>typeof x==="number"?x:(parseFloat(x)||null);
        const L=num(val(r,col.L)),W=num(val(r,col.W)),H=num(val(r,col.H)),K=num(val(r,col.pkgs));
        let cbm=num(val(r,col.cbm)); if(cbm==null&&L&&W&&H&&K)cbm=+(L*W*H/1e9*K).toFixed(3);
        const old=DATA.items.find(i=>i.id===id);
        const photo=(await grab(r,col.photo,`photos/${h}_p.jpg`,640))||old?.photo||"";
        const lps=[];for(let j=0;j<lpCols.length;j++){const q=await grab(r,lpCols[j],`photos/${h}_L${j+1}.jpg`,900);if(q)lps.push(q);}
        p+=(photo&&pendingFiles[photo]?1:0)+lps.length;
        const it={id,ship,inv:meta.inv||"",pkg:pkg||name,name,ar:old?.ar||"",detail:String(val(r,col.detail)||"").replace(/^=/,""),cat:String(val(r,col.cat)||""),use:String(val(r,col.use)||""),size:String(val(r,col.size)||""),material:String(val(r,col.material)||""),
          qty:val(r,col.qty),unit:String(val(r,col.unit)||""),pkgs:K,pkgType:String(val(r,col.pkgType)||""),nw:num(val(r,col.nw)),gw:num(val(r,col.gw)),cbm:cbm!=null?+cbm.toFixed(3):null,photo,loadPhotos:lps.length?lps:(old?.loadPhotos||[]),src:f.name};
        seen.add(id);
        if(old){Object.assign(old,it);u++;}else{DATA.items.push(it);a++;}
        if(!it.ar)newItems.push(old||it); n++;
      }
      for(const x of touched) if(!lastImported.includes(x)) lastImported.push(x);
      if(n){const before=DATA.items.length;DATA.items=DATA.items.filter(i=>i.src!==f.name||seen.has(i.id));const gone=before-DATA.items.length;if(gone)lines.push(`${f.name}：清除了上次导入的 ${gone} 行旧数据`);
        const used=new Set(DATA.items.map(i=>i.ship));DATA.shipments=DATA.shipments.filter(x=>used.has(x.id));}
      if(!n) lines.push(`⚠ ${f.name}：没有读到任何货物行，请把这个文件发给技术人员检查格式。`);
      lines.push(ta("imported",{f:f.name,n,a,u,p})+(headers>1?`，共 ${headers} 段表头`:"")+(meta.inv?`（发票 ${meta.inv}）`:"（没读到发票号）"));
    }catch(e){lines.push(`${f.name}: ${e&&e.message||e}`);}
    log.textContent=lines.join("\n")+"\n清单已读取，可以直接点下方按钮保存。";
  }
  markDirty(); renderShipForms(); renderImportResult();
}
})();
